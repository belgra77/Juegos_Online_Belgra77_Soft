<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Juegos Online Belgra_77_Soft</title>
  <meta name="description" content="Colección de juegos online de Belgra_77_Soft" />
  <meta name="theme-color" content="#0f1729" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800&display=swap" rel="stylesheet" />
  
  <!-- Boxicons para íconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/boxicons/2.1.4/fontawesome-boxion.css">
  
  <style>
    :root {
      --bg: #0f1729;
      --card: #1e293b;
      --accent: #e74c3c;
      --accent-light: #f6e05e;
      --text: #f8fafc;
      --muted: #64748b;
      --green: #10b981;
    }
    
    * { box-sizing: border-box; }
    
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      margin: 0;
    }
    
    .glass {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(100, 116, 139, 0.3);
    }
    
    .game-card {
      background: var(--card);
      border: 1px solid rgba(100, 116, 139, 0.3);
      border-radius: 12px;
      padding: 2rem;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    
    .game-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1rem;
    }
    
    .version-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #ef444d;
      color: white;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 9999px;
      font-weight: 700;
    }
    
    .new-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: var(--green);
      color: white;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 9999px;
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .no-game {
      background: rgba(30, 41, 59, 0.5);
      border: 1px dashed var(--muted);
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
    }
    
    @media (max-width: 640px) {
      .game-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="fixed top-0 left-0 right-0 z-50 bg-black/80 backdrop-blur-xl border-b border-white/10">
    <div class="max-w-7xl mx-auto px-6 py-4">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-bold">Juegos Online</h1>
          <p class="text-sm text-white/60">Colección de Belgra_77_Soft</p>
        </div>
        <div class="hidden sm:flex items-center gap-4">
          <button id="btn-music" class="glass rounded-full px-4 py-2 text-sm pressed">🎵 Música</button>
        </div>
      </div>
    </div>
  </nav>
  
  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-6 py-16">
    <div class="game-grid grid grid-cols-2 md:grid-cols-3 gap-6" id="games-grid">
      <!-- Juegos se insertarán aquí por JavaScript -->
    </div>
    
    <!-- Version info -->
    <div class="mt-8 text-center">
      <p class="text-sm text-white/60">Versión actual: <span id="current-version">0.0.1</span></p>
      <p class="text-xs text-white/40 mt-1" id="update-notice">Sistema de versión 0.0.1</p>
    </div>
  </main>

  <!-- Script de detección y versiones -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Versión actual
      document.getElementById('current-version').textContent = 'v0.0.1';
      
      // Configuración de juegos detectables
      const detectableGames = [
        { folder: 'Tres_Raya', file: 'tres_raya.joc', name: 'Tres en Raya', icon: 'icons/icon-192.png' },
        { folder: 'Conecta_4', file: 'conecta_4.joc', name: 'Conecta 4', icon: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192"><rect width="192" height="192" rx="32" fill="%230f1729"/><circle cx="60" cy="70" r="30" fill="%23facc15"/><circle cx="132" cy="70" r="30" fill="%23ef4444"/><circle cx="60" cy="130" r="30" fill="%23ef4444"/><circle cx="132" cy="130" r="30" fill="%23facc15"/></svg>' }
      ];
      
      function detectGames() {
        const games = detectableGames.map(game => ({
          name: game.name,
          folder: game.folder,
          path: game.folder + '/' + game.file,
          icon: game.folder + '/' + (game.icon || 'icons/icon-192.png'),
          version: 'v0.0.1'
        }));
        renderGames(games);
      }
      
      function renderGames(games) {
        const grid = document.getElementById('games-grid');
        grid.innerHTML = '';
        
        games.forEach(game => {
          const card = document.createElement('div');
          card.className = 'game-card';
          card.innerHTML = `
            <a href="${game.path}" style="display:block;">
              <img src="${game.folder}/banner.png" alt="${game.name}" style="width:100%;height:120px;object-fit:cover;border-radius:8px;margin-bottom:1rem;cursor:pointer;" />
            </a>
            <h3 class="font-medium text-sm truncate">${game.name}</h3>
            <p class="text-sm text-white/60 mt-1">${game.version}</p>
          `;
          grid.appendChild(card);
        });
      }
      
      function checkForUpdates() {
        const updateNotice = document.getElementById('update-notice');
        updateNotice.textContent = 'Última revisión: ' + new Date().toLocaleDateString();
      }
      
      // Inicializar
      detectGames();
      checkForUpdates();
    });
  </script>
  <audio id="bgm" autoplay src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" loop preload="auto"></audio>
  <script>
    const bgm=document.getElementById('bgm');
    document.getElementById('btn-music').addEventListener('click',()=>{
      if(bgm.paused){bgm.play();document.getElementById('btn-music').textContent='🎵 Música ON';}
      else{bgm.pause();document.getElementById('btn-music').textContent='🎵 Música';}
    });
  </script>
  <script>
    document.addEventListener('click',e=>{
      const link=e.target.closest('a');
      if(!link) return;
      e.preventDefault();
      const href=link.getAttribute('href');
      for(let i=0;i<60;i++){
        const p=document.createElement('span');
        const colors=['#f6e05e','#e74c3c','#10b981','#3b82f6','#a855f7','#f97316'];
        const c=colors[Math.floor(Math.random()*colors.length)];
        p.style.cssText='position:fixed;pointer-events:none;width:12px;height:12px;border-radius:50%;background:'+c+';left:'+ (e.clientX) +'px;top:'+ (e.clientY) +'px;transition:all 1s ease;opacity:1;box-shadow:0 0 12px '+c+';';
        document.body.appendChild(p);
        const ang=Math.random()*Math.PI*2; const dist=80+Math.random()*120;
        requestAnimationFrame(()=>{p.style.transform='translate('+(Math.cos(ang)*dist)+'px,'+(Math.sin(ang)*dist)+'px) scale(0)';p.style.opacity='0';});
        setTimeout(()=>p.remove(),1000);
      }
      setTimeout(()=>{window.location.href=href;},700);
    });
  </script>
</body>
</html>
